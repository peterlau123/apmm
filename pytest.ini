[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests - fast, isolated, no external dependencies
    integration: Integration tests - may require external services or state
    perf: Performance tests - measure execution time and throughput
    remote: Tests requiring remote SSH/bastion access (skipped by default)

addopts = -m "not remote"