bastion:
  auto_restart: true
  heartbeat_interval: 15
  managed_by: hermes
  notify_on_disconnect: true
  otp_timeout: 300
  profile: t_h20
config:
  batch_config_path: '{batch_dir_template}/batch_config.json'
  batch_dir_template: '{run_dir}/batches/{batch_id}'
  batch_logs_dir: '{batch_dir_template}/logs'
  batch_results_path: '{batch_dir_template}/batch_results.json'
  batch_size: 8
  batches_dir: '{run_dir}/batches'
  container_env:
    CUDA_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
    HF_DATASETS_CACHE: /gpfs/gcsp/M2.7_verify/pytorch_verify/2.5.1/ut/hf_hub/datasets
    HF_HOME: /gpfs/gcsp/M2.7_verify/pytorch_verify/2.5.1/ut/hf_hub
    HF_HUB_CACHE: /gpfs/gcsp/M2.7_verify/pytorch_verify/2.5.1/ut/hf_hub/hub
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_CACHE: /gpfs/gcsp/M2.7_verify/pytorch_verify/2.5.1/ut/hf_hub/hub
  docker_container: v0.13.0_torch2.5.1_compile
  filter_rules_path: '{workspace}/skills/ut/ut_common/filter_rules.yaml'
  gpu_per_test: 2
  handled_tests_path: '{batch_dir_template}/handled_tests.json'
  logs_dir: '{run_dir}/logs'
  manifest_path: '{run_dir}/manifest.json'
  manifest_schema_path: '{workspace}/skills/ut/ut_common/manifest_schema.json'
  max_retry_per_test: 3
  pytest_args: -q --tb=long
  remote_server: t_h20
  reports_dir: '{run_dir}/reports'
  resume_from: null
  run_dir: null
  runs_dir: D:/workspace/apmm/runs
  test_list_path: '{run_dir}/test_list.txt'
  ut_logs_dir: /gpfs/gcsp/M2.7_verify/vllm/ut_logs
  vllm_dir: /gpfs/gcsp/M2.7_verify/vllm
  workflow_state_path: '{run_dir}/workflow_state.json'
  workspace: D:/workspace/apmm
decision_interface:
  fallback: yaml_config
  hermes_workflow: feishu
  terminal_workflow: terminal
input_filter:
  filter:
    count: null
    error_type: null
    status: null
  manifest_source: D:\workspace\apmm\runs\ut-20260714-203925\manifest.json
  range: null
  remote_collect:
    container: v0.13.0_torch2.5.1_compile
    enabled: false
    server: t_h20
    vllm_dir: /gpfs/gcsp/M2.7_verify/vllm
  test_list_path: null
kanban:
  board:
    name: apmm-ut
    slug: apmm-ut
  circuit_breaker:
    error_rate_threshold: 0.8
    failure_limit: 3
  enabled: false
  gateway:
    auto_start: true
    check_interval: 60
    startup_timeout: 30
  profiles:
    batch_selector: ut-batch-selector
    executor: ut-executor
    fixer: ut-fixer
    manifest_updater: ut-manifest-updater
  task_creation:
    body_template: Orchestrate UT run for {test_list_path}
    initial_assignee: ut-batch-selector
    priority: 1
loop:
  break_conditions:
  - action: pause
    condition: consecutive_failures > 50
    kanban_note: 'Paused: consecutive_failures > 50'
    notify: true
  - action: pause
    condition: error_rate > 0.8
    kanban_note: 'Paused: error_rate > 80%'
    notify: true
  - action: stop
    condition: stop_requested == true
    notify: true
  max_iterations: 1000
  stages:
  - select_batch
  - execute
  - handle_failures
  - update_status
  stop_condition: pending_count == 0
notifications:
  feishu_chat_id: oc_2e75db818ac1792238037a704b4d32d3
  notify_on:
  - condition: batch_completed
    include_kanban_link: true
    template: 'Batch {batch_id}: {passed}/{total} passed'
  - condition: workflow_completed
    include_kanban_snapshot: true
    template: 'Workflow完成: {passed_count} passed, {failed_count} failed, {ignored_count}
      ignored'
  - condition: milestone
    template: 'Milestone: {passed_count} tests passed!'
    trigger: stats.passed % 100 == 0
  - condition: error_rate > 0.5
    template: '高错误率: {error_rate}%'
  - condition: paused
    template: 'Workflow暂停: {pause_reason}'
  - condition: worker_error
    template: 'Worker错误 ({stage}): {error_message}'
phase1:
  auto_create_batches: true
  auto_execute: true
  checkpoint_interval: 10
  enable_force_checkpoints: true
phase2:
  stage1:
    auto_generate_suggestions: true
    generate_report: true
    report_formats:
    - json
    - markdown
  stage2:
    auto_retry_error_types: []
    retry_on_decision: true
    wait_for_manual_decision: true
stages:
- delegate_to: self
  description: 从test_list.txt生成manifest.json
  id: collect
  input:
    manifest_schema_path: '{workspace}/skills/ut/ut_common/manifest_schema.json'
    test_list_path: '{run_dir}/test_list.txt'
  kanban:
    action: create_board
    board_name: UT Test Progress
  loop: false
  output:
    manifest_path: '{run_dir}/manifest.json'
  skill: ut-test-collector
- delegate_to: self
  description: 选择下一批次测试
  id: select_batch
  input:
    batch_size: 8
    manifest_path: '{run_dir}/manifest.json'
  kanban:
    action: create_lane
    lane_name_template: batch_{batch_id}
    lane_type: running
  loop: true
  output:
    batch_config_path: '{batch_dir_template}/batch_config.json'
  skill: batch-selector
- delegate_to: self
  description: '执行pytest测试并生成batch_results.json

    内置步骤:

    1. 启动 pytest 执行

    2. 从远程 ut_logs grep 提取 PASSED/FAILED/ERROR 行

    3. 调用 parse_remote_log.py 解析并生成 batch_results.json

    '
  id: execute
  input:
    batch_config_path: '{batch_dir_template}/batch_config.json'
    docker_container: v0.13.0_torch2.5.1_compile
    pytest_args: -q --tb=long
    remote_server: t_h20
    ut_logs_dir: /gpfs/gcsp/M2.7_verify/vllm/ut_logs
  kanban:
    action: update_lane
    progress_template: '{passed}/{total}'
  log_extraction:
    enabled: true
    grep_pattern: (PASSED|FAILED|ERROR|SKIPPED)
    grep_timeout: 60
    parse_script: '{workspace}/skills/ut/unit-test-executor/scripts/parse_remote_log.py'
  loop: true
  output:
    batch_results_path: '{batch_dir_template}/batch_results.json'
  pytest_idle_timeout: 120
  skill: unit-test-executor
  timeout: 600
- agent_required: true
  delegate_to: self
  description: 分析失败原因，尝试修复（Agent判断）
  id: handle_failures
  input:
    batch_results_path: '{batch_dir_template}/batch_results.json'
    max_failed_per_iteration: 10
    max_retry_per_test: 3
  loop: true
  output:
    handled_tests_path: '{batch_dir_template}/handled_tests.json'
  skill: failure-handler
  timeout: 900
- delegate_to: self
  description: 更新manifest.json状态
  id: update_status
  input:
    batch_results_path: '{batch_dir_template}/batch_results.json'
    handled_tests_path: '{batch_dir_template}/handled_tests.json'
    manifest_path: '{run_dir}/manifest.json'
  kanban:
    action: move_lane
    lane_name_template: batch_{batch_id}
    summary_template: '{passed}/{total} passed'
    target_lane_template: '{result_lane}'
  loop: true
  output:
    manifest_path: '{run_dir}/manifest.json'
  skill: manifest-updater
worker_output_schema:
  blocked_reason: string_or_null
  error: string_or_null
  next_action: string
  stats:
    error: integer
    failed: integer
    ignored: integer
    passed: integer
    pending: integer
workflow:
  description: Hierarchical Agent架构 - Supervisor调度 + Worker执行 + Kanban追踪
  execution_strategy: two-phase
  name: UT Test Workflow
  test_load:
    count: 8
    output_dir: '{run_dir}'
    source: null
  test_name: ut
  version: '2.2'
