# ut-supervisor — long-running Hermes Agent profile for hermes_workflow
#
# SCHEMA NOTE (verified against live Hermes install on 2026-06-20):
#   Real Hermes profile.yaml files (e.g. profiles/ut-orchestrator/profile.yaml)
#   contain ONLY two keys: `description` and `description_auto`. The richer
#   fields from the plan draft (feishu subscribe / chat_id / trigger_keywords /
#   auto_load_skills) are NOT part of profile.yaml — they live elsewhere in the
#   profile directory at deploy time:
#     - Feishu chat binding  -> channel_directory.json  (platforms.feishu[].id)
#     - Feishu skill bindings -> config.yaml -> platforms.feishu.channel_skill_bindings
#     - Skill loading         -> config.yaml -> skills.*  (+ profile skills/ dir)
#   The active profile.yaml below mirrors the real minimal schema so it can be
#   dropped into ~/AppData/Local/hermes/profiles/ut-supervisor/ as-is.
#   The `x-deploy` block records the intended wiring for deploy-time setup; it is
#   a non-schema annotation (x- prefix) and is ignored by Hermes.

description: 'UT Workflow production supervisor: long-running Feishu-subscribing agent that runs the hermes_workflow loop with OTP auto-recovery. Good at: orchestrating UT batches, monitoring progress, OTP/bastion reconnection.'
description_auto: false

# --- deploy-time wiring (NOT read by Hermes; see SCHEMA NOTE above) ---
x-deploy:
  feishu:
    subscribe: true
    chat_id: "<feishu_chat_id>"          # set at deploy — bind via channel_directory.json
    trigger_keywords: ["跑 ut workflow", "启动测试", "开始 UT"]
  auto_load_skills:
    - ut/hermes_workflow
    - ut/workflow_loop_core
    - ut/batch-selector
    - ut/unit-test-executor
    - ut/failure-handler
    - ut/manifest-updater
