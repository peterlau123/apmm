# UT Workflow 过滤规则
# 单一来源：所有脚本从此文件读取
# 最后更新：2026-06-29

filter_rules:
  updated_at: "2026-07-19T00:00:00"
  version: "1.1"

  rules:
    # === 硬件平台（排除） ===
    - pattern: "tests/**/*rocm*"
      type: "exclude"
      reason: "ROCm 硬件不支持"

    - pattern: "tests/tpu/*"
      type: "exclude"
      reason: "TPU 平台不支持"

    - pattern: "tests/**/*tpu*"
      type: "exclude"
      reason: "TPU 相关测试"

    # === 多模态模型（排除） ===
    - pattern: "tests/**/multimodal*"
      type: "exclude"
      reason: "多模态模型，HF离线模式问题"

    - pattern: "tests/**/*image*.py"
      type: "exclude"
      reason: "图像处理相关"

    - pattern: "tests/**/*video*.py"
      type: "exclude"
      reason: "视频处理相关"

    - pattern: "tests/**/*audio*"
      type: "exclude"
      reason: "音频处理相关"

    - pattern: "tests/**/encoder*"
      type: "exclude"
      reason: "编码器相关"

    - pattern: "tests/**/prithvi*"
      type: "exclude"
      reason: "Prithvi 模型"

    - pattern: "tests/**/*whisper*"
      type: "exclude"
      reason: "Whisper 模型"

    - pattern: "tests/entrypoints/openai/test_translation_validation.py"
      type: "exclude"
      reason: "音频翻译测试，需 whisper/Gemma2 音频模型，离线环境无缓存"

    - pattern: "tests/**/**multi_modal**"
      type: "exclude"
      reason: "多模态相关"

    - pattern: "tests/**/**_mm_**"
      type: "exclude"
      reason: "多模态相关"

    # === 特定框架/组件（排除） ===
